[supervisord]
nodaemon=true
user=root

[program:sandbox-api]
command=python -m gunicorn app.main:app --workers=2 --worker-class=uvicorn.workers.UvicornWorker --bind=0.0.0.0:%(ENV_PORT)s --timeout=60
directory=/app/sandbox
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="%(ENV_PORT)s"
