                    "label": "2023 Sales",
                    "data": final_df["sales_2023"].tolist()
                }},
                {{
                    "label": "2024 Sales",
                    "data": final_df["sales_2024"].tolist()
                }}
            ]
        }}
    }}

    # Output the JSON data
    print(json.dumps(chart_data, indent=4))
    ```

