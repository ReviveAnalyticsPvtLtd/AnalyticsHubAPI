[supervisord]
nodaemon=true
user=root

[program:fastapi]
command=uv run gunicorn main:app --workers=8 --worker-class=uvicorn.workers.UvicornWorker --bind=0.0.0.0:7860 --max-requests=20 --max-requests-jitter=10 --timeout=300
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
command=uv run celery -A analyticsHub.triggers.celery.celeryApp worker --loglevel=info --concurrency=2
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery-beat]
command=uv run celery -A analyticsHub.triggers.celery.celeryApp beat --loglevel=info
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0