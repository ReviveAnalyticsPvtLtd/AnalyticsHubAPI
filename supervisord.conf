[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
minfds=1024
minprocs=4096

[program:fastapi]
command=sh -c 'exec uv run gunicorn main:app --workers=${WEB_WORKERS:-2} --worker-class=uvicorn.workers.UvicornWorker --bind=0.0.0.0:7860 --preload --max-requests=50 --max-requests-jitter=20 --timeout=300 --graceful-timeout=10 --keep-alive=30'
environment=PYTHONUNBUFFERED="1",GUNICORN_CMD_ARGS="--log-level info",POLARS_MAX_THREADS="2",OPENBLAS_NUM_THREADS="2"
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery-compute]
command=sh -c 'exec uv run celery -A nubrix.triggers.celery.celeryApp worker --loglevel=info --concurrency=${CELERY_COMPUTE_CONCURRENCY:-2} --max-tasks-per-child=50 -Q compute'
environment=POLARS_MAX_THREADS="2",OPENBLAS_NUM_THREADS="2"
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery-billing]
command=sh -c 'exec uv run celery -A nubrix.triggers.celery.celeryApp worker --loglevel=info --concurrency=${CELERY_BILLING_CONCURRENCY:-1} --max-tasks-per-child=50 -Q billing'
environment=POLARS_MAX_THREADS="2",OPENBLAS_NUM_THREADS="2"
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery-beat]
command=uv run celery -A nubrix.triggers.celery.celeryApp beat --loglevel=info
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0