[supervisord]
nodaemon=true
user=root

[program:fastapi]
command=gunicorn main:app --workers=6 --worker-class=uvicorn.workers.UvicornWorker --bind=0.0.0.0:7860 --max-requests=20 --max-requests-jitter=10 --timeout=120
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
command=celery -A analyticsHub.components.celery.task worker --loglevel=info --concurrency=2
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0