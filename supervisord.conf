[supervisord]
nodaemon=true
user=root

[program:fastapi]
command=uv run gunicorn main:app --workers=${WEB_WORKERS:-12} --worker-class=uvicorn.workers.UvicornWorker --bind=0.0.0.0:7860 --max-requests=100 --max-requests-jitter=20 --timeout=300 --graceful-timeout=10 --keep-alive=30
environment=PYTHONUNBUFFERED="1",GUNICORN_CMD_ARGS="--log-level info"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
command=uv run celery -A nubrix.triggers.celery.celeryApp worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4}
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery-beat]
command=uv run celery -A nubrix.triggers.celery.celeryApp beat --loglevel=info
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0