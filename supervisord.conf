[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/tmp/supervisord.pid

[program:fastapi]
command=gunicorn app:app --workers 8 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:7860 --max-requests 20 --max-requests-jitter 10
directory=/app
autostart=true
autorestart=true

[program:celery]
command=celery -A analyticsHub.components.celery.task worker --loglevel=info --concurrency=2
directory=/app
autostart=true
autorestart=true