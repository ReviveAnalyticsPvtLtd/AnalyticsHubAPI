temperature = 1
maxTokens = 512

[METADATAGENERATOR]
model = gemini-2.5-flash
temperature = 0.25

[CODEGENERATOR]
model = gemini-2.5-flash
temperature = 0.25

[CODEDEBUGGER]
model = gemini-2.5-flash
temperature = 0.25

[INSIGHTGENERATOR]
