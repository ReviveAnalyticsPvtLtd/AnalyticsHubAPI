model = qwen/qwen3-next-80b-a3b-instruct
temperature = 0.25

[CODEGENERATOR]
model = qwen/qwen3-next-80b-a3b-instruct
temperature = 0.25

[CODEDEBUGGER]
model = qwen/qwen3-next-80b-a3b-instruct
temperature = 0.25

[INSIGHTGENERATOR]
model = qwen/qwen3-next-80b-a3b-instruct
