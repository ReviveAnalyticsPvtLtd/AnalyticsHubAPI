name: Subscription Expiry Manager

on:
  # Run automatically every day
  schedule:
    - cron: "0 1 * * *"   # every day at 01:00 UTC

  # Allow manual execution if needed
  workflow_dispatch:

jobs:
  run-subscription-manager:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase requests python-dateutil

      - name: Run subscription manager
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FREE_TRIAL_EXPIRY_WARNING_EMAIL_URL: ${{ secrets.FREE_TRIAL_EXPIRY_WARNING_EMAIL_URL }}
        run: |
          python utils/subscriptionManager.py
